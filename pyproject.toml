[project]
name = "accq"
version = "0.1.0"
description = "Sourcing old Dutch owner-run businesses for acquisition outreach (free-first pipeline)"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyyaml>=6", "beautifulsoup4>=4.12"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
accq = "accq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
